# ===========================================
# Quarkus Application Configuration
# Optimized for AKS Deployment
# ===========================================

# HTTP Server
quarkus.http.port=8181
quarkus.http.host=0.0.0.0

# RabbitMQ Connection (from environment variables)
quarkus.rabbitmq.host=${RABBITMQ_HOST:rabbitmq-service.rabbitmq.svc.cluster.local}
quarkus.rabbitmq.port=${RABBITMQ_PORT:5672}
quarkus.rabbitmq.username=${RABBITMQ_USERNAME:guest}
quarkus.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# RabbitMQ Outgoing Channel (Producer)
mp.messaging.outgoing.orders-out.connector=smallrye-rabbitmq
mp.messaging.outgoing.orders-out.exchange.name=orders.exchange
mp.messaging.outgoing.orders-out.exchange.type=topic
mp.messaging.outgoing.orders-out.routing.key=orders.new
mp.messaging.outgoing.orders-out.content-type=application/json
mp.messaging.outgoing.orders-out.durable=true

# RabbitMQ Incoming Channel (Consumer)
mp.messaging.incoming.orders-in.connector=smallrye-rabbitmq
mp.messaging.incoming.orders-in.exchange.name=orders.exchange
mp.messaging.incoming.orders-in.exchange.type=topic
mp.messaging.incoming.orders-in.routing.key=orders.new
mp.messaging.incoming.orders-in.durable=true
mp.messaging.incoming.orders-in.auto-binding-queues=true
mp.messaging.incoming.orders-in.queue.name=orders.processing

# Health Checks
quarkus.smallrye-health.ui.enable=true
quarkus.smallrye-health.openapi-info-description=false

# Logging for containers
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=INFO
quarkus.log.console.darken=1

# Quarkus Optimization
quarkus.live-reload.instrumentation=false
quarkus.package.type=fast-jar
